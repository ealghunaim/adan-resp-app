{% extends "base.html" %}{% block content %}<h1>Audit log</h1><div class="card"><table><tr><th>When (UTC)</th><th>User</th><th>Action</th><th>Detail</th></tr>
{% for r in rows %}<tr><td>{{ r.at.strftime('%Y-%m-%d %H:%M') }}</td><td>{{ r.user.full_name if r.user else '-' }}</td><td>{{ r.action }}</td><td>{{ r.detail }}</td></tr>{% endfor %}</table></div>{% endblock %}
