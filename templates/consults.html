{% extends "base.html" %}{% from "_lists.html" import consult_table with context %}{% block content %}
<h1>Consults</h1><form method="get" style="margin-bottom:10px"><select name="status" onchange="this.form.submit()"><option value="">All statuses</option>{% for k, l in CONSULT_STATUS.items() %}<option value="{{ k }}" {{ 'selected' if st==k }}>{{ l }}</option>{% endfor %}</select> <select name="dx" onchange="this.form.submit()"><option value="">All diagnoses</option><option value="none" {{ 'selected' if dx=='none' }}>Diagnosis not set</option>{% for d in diagnoses %}<option {{ 'selected' if dx==d }}>{{ d }}</option>{% endfor %}</select>{% if current_user.is_team %} <a class="btn sm sec" href="{{ url_for('consults.retro_new') }}">+ Past consult</a>{% endif %}</form>
<div class="card">{{ consult_table(rows, "No consults.") }}</div>{% endblock %}
