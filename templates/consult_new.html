{% extends "base.html" %}{% block content %}
<h1>New Respirology consult</h1><p class="muted">Al-Adan Hospital inpatients or patients seen at Al-Adan. Fields marked * are required.</p>
<form method="post">{% include "_patient_fields.html" %}
<div class="card"><h2>Consult</h2><div class="ff">
<div><label>Referring department / unit</label><input name="referring_department" value="{{ form.get('referring_department', current_user.department or '') }}"></div>
<div><label>Consultant in charge</label><input name="consultant_in_charge" value="{{ form.get('consultant_in_charge','') }}"></div>
<div><label>Ward</label><input name="ward" value="{{ form.get('ward','') }}"></div><div><label>Bed</label><input name="bed" value="{{ form.get('bed','') }}"></div>
<div><label>Your contact phone *</label><input name="contact_phone" value="{{ form.get('contact_phone', current_user.phone or '') }}"></div>
<div><label>Your email</label><input type="email" name="contact_email" value="{{ form.get('contact_email', current_user.email) }}"></div>
<div><label>Urgency</label><select name="urgency">{% for k, l in URGENCY.items() %}<option value="{{ k }}" {{ 'selected' if form.get('urgency')==k }}>{{ l }}</option>{% endfor %}</select></div>
<div class="wide"><label>Reason for consult * (one line)</label><input name="reason" maxlength="300" value="{{ form.get('reason','') }}" required></div>
<div class="wide"><label>Clinical summary * (history, findings, investigations, treatment so far, question)</label><textarea name="clinical_summary" rows="8" required>{{ form.get('clinical_summary','') }}</textarea></div></div></div>
<p><button class="btn">Send consult</button></p></form>{% endblock %}
